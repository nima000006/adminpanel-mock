server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html =404;
  }

  # The app shell and the worker itself must never be served from a stale cache,
  # otherwise a deploy keeps shipping old bundles and old auth logic.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Build output carries a content hash in its name, so it can be cached forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Stable file names: the service worker answers these instantly from its cache and
  # revalidates in the background, so keep revalidation here cheap instead of long lived.
  location ~* ^/(fonts|images|audio)/ {
    add_header Cache-Control "no-cache";
  }

  # Icons and logo served from the site root.
  location ~* ^/[^/]+\.(ico|png|svg|webp)$ {
    add_header Cache-Control "no-cache";
  }
         
