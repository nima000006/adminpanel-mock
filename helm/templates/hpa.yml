{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "apps.fullname" . }}
  labels:
    {{- include "apps.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v2
    kind: Deployment
    name: {{ include "apps.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.autoscaling.averageCPUUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.averageCPUUtilization }}
  {{- end }}
  {{- if .Values.autoscaling.averageMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.averageMemoryUtilization }}
  {{- end }}
{{- end }}
